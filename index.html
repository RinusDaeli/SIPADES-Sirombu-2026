    <style>
      #app-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #070B14;
        color: #f1f5f9;

        padding: 1.5rem;
        text-align: center;
      }
      .loader-spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1.25rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // 1. Immediately purge legacy bloated base64 keys before React loads
      (function() {
        try {
          var purgeKeys = [
            'sipad_asets_v6',
            'sipad_asets_v5',
            'sipad_asets_v4',
            'sipad_asets_v3',
            'sipad_asets_v2',
            'sipad_asets_v1',
            'sipad_desas_v6',
            'SIPADES_DATA_REVISION'
          ];
          for (var i = 0; i < purgeKeys.length; i++) {
            if (localStorage.getItem(purgeKeys[i])) {
              localStorage.removeItem(purgeKeys[i]);
            }
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#0B0F19] text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased min-h-screen selection:bg-amber-500 selection:text-black">
    <div id="root">
      <div id="app-loader">
        <div class="loader-spinner"></div>
        <h1 style="font-size: 1.15rem; font-weight: 800; letter-spacing: 0.05em; margin: 0 0 0.25rem 0; text-transform: uppercase; color: #ffffff;">

          Kecamatan Sirombu • Kabupaten Nias Barat
        </p>
        <p id="loader-status-text" style="font-size: 0.7rem; color: #94a3b8; margin: 0;">
          Memuat Sistem Informasi Aset Desa...
        </p>
        <div id="loader-recovery-btn" style="display:none;margin-top:16px;">
          <button
            onclick="window.location.reload();"
            style="background:#f59e0b;color:#0b0f19;border:none;padding:9px 18px;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(245,158,11,0.3);"
          >
            🔄 Muat Ulang Halaman
          </button>
          <div style="margin-top:10px;">
            <button
              onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload();"
              style="background:transparent;color:#94a3b8;border:none;padding:4px 8px;font-size:11px;text-decoration:underline;cursor:pointer;"
            >
              Reset Cache &amp; Login Ulang
            </button>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <main style="max-width:720px;margin:2rem auto;padding:1.5rem;font-family:sans-serif;color:#f1f5f9;">
        <h1>SIPADES SIROMBU - Sistem Informasi Pengelolaan Aset Desa Kecamatan Sirombu</h1>
        <p>Portal resmi pendataan, inventarisasi, verifikasi, mutasi, dan pelaporan aset tetap desa di wilayah Kecamatan Sirombu, Kabupaten Nias Barat sesuai Permendagri No. 20 Tahun 2018.</p>
        <p>Mohon aktifkan JavaScript pada browser Anda untuk mengakses aplikasi SIPADES Sirombu.</p>
      </main>
    </noscript>
    <script>
      // Gently inform user on slower mobile connections before showing reload option
      setTimeout(function() {
        var txt = document.getElementById('loader-status-text');
        if (txt) txt.textContent = 'Koneksi sedang memuat modul aplikasi, mohon tunggu sebentar...';
      }, 4500);

      // Only show recovery button if truly stalled beyond 12 seconds
      setTimeout(function() {
        var btn = document.getElementById('loader-recovery-btn');
        if (btn) btn.style.display = 'block';
        var txt = document.getElementById('loader-status-text');
        if (txt) txt.textContent = 'Koneksi ke server agak lambat. Anda dapat menunggu atau memuat ulang halaman.';
      }, 12000);

      // Global error listener to display error if a script fails to execute
      window.addEventListener('error', function(e) {
        var txt = document.getElementById('loader-status-text');
        if (txt) {
          txt.style.color = '#f87171';
          txt.textContent = 'Kendala modul: ' + (e.message || 'Gagal memuat skrip');
        }
        var btn = document.getElementById('loader-recovery-btn');
        if (btn) btn.style.display = 'block';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
