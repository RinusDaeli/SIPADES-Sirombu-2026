<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIPADES SIROMBU - Pengelolaan Aset Desa Nias Barat</title>
    <meta name="description" content="Sistem Informasi Pendataan, Verifikasi, dan Pelaporan Aset Tetap Desa Kecamatan Sirombu Kabupaten Nias Barat sesuai Permendagri No. 20 Tahun 2018" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:title" content="SIPADES SIROMBU - Pengelolaan Aset Desa Nias Barat" />
    <meta property="og:description" content="Sistem Informasi Pendataan, Verifikasi, dan Pelaporan Aset Tetap Desa Kecamatan Sirombu Kabupaten Nias Barat sesuai Permendagri No. 20 Tahun 2018" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      #app-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #070B14;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        padding: 1.5rem;
        text-align: center;
      }
      .loader-spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1.25rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // 1. Immediately purge legacy bloated base64 keys before React loads
      (function() {
        try {
          var purgeKeys = [
            'sipad_asets_v6',
            'sipad_asets_v5',
            'sipad_asets_v4',
            'sipad_asets_v3',
            'sipad_asets_v2',
            'sipad_asets_v1',
            'sipad_desas_v6',
            'SIPADES_DATA_REVISION'
          ];
          for (var i = 0; i < purgeKeys.length; i++) {
            if (localStorage.getItem(purgeKeys[i])) {
              localStorage.removeItem(purgeKeys[i]);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0B0F19] text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased min-h-screen selection:bg-amber-500 selection:text-black">
    <div id="root">
      <div id="app-loader">
        <div class="loader-spinner"></div>
        <h1 style="font-size: 1.15rem; font-weight: 800; letter-spacing: 0.05em; margin: 0 0 0.25rem 0; text-transform: uppercase; color: #ffffff;">
          SIPADES SIROMBU
        </h1>
        <p style="font-size: 0.75rem; color: #34d399; margin: 0 0 0.5rem 0; font-weight: 600;">
          Kecamatan Sirombu • Kabupaten Nias Barat
        </p>
        <p id="loader-status-text" style="font-size: 0.7rem; color: #94a3b8; margin: 0;">
          Memuat Sistem Informasi Aset Desa...
        </p>
        <div id="loader-recovery-btn" style="display:none;margin-top:16px;">
          <button
            onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload(true);"
            style="background:#f59e0b;color:#0b0f19;border:none;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(245,158,11,0.3);"
          >
            ⚡ Masuk Cepat / Segarkan Halaman
          </button>
        </div>
      </div>
    </div>
    <script>
      // If still loading after 2.5s, display instant refresh button
      setTimeout(function() {
        var btn = document.getElementById('loader-recovery-btn');
        if (btn) btn.style.display = 'block';
        var txt = document.getElementById('loader-status-text');
        if (txt) txt.textContent = 'Menyiapkan modul aplikasi...';
      }, 2500);

      // Global error listener to display error if a script fails to execute
      window.addEventListener('error', function(e) {
        var txt = document.getElementById('loader-status-text');
        if (txt) {
          txt.style.color = '#f87171';
          txt.textContent = 'Kendala modul: ' + (e.message || 'Gagal memuat skrip');
        }
        var btn = document.getElementById('loader-recovery-btn');
        if (btn) btn.style.display = 'block';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
